name: Publish AutoTek ERP v1.0.12

on:
  push:
    branches:
      - main
    paths:
      - release-v1.0.12.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d4a8-8211-bc33-08e10bde6785/raw?se=2026-09-26T15%3A18%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=a726a724-f276-5565-b8bc-6b1031fc2622&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A48%3A09Z&ske=2026-09-26T19%3A48%3A09Z&sks=b&skv=2026-02-06&sig=wXT4gVNriuXuTDzAT6ZVUyFUmJazT1TOiS0l2GPvg4M%3D'
      VERSION: '1.0.12'
    steps:
      - name: Download verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o update.zip
          unzip -q update.zip -d payload
          find payload -maxdepth 2 -type f -print

      - name: Verify update payload
        shell: bash
        run: |
          set -euo pipefail
          test -f "payload/AutoTek-ERP-Setup-$VERSION-x64.exe"
          test -f "payload/AutoTek-ERP-Setup-$VERSION-x64.exe.blockmap"
          test -f "payload/latest.yml"
          grep -q "version: $VERSION" payload/latest.yml
          echo "RELEASE_PAYLOAD_VERIFY=PASS"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION"             "payload/AutoTek-ERP-Setup-$VERSION-x64.exe"             "payload/AutoTek-ERP-Setup-$VERSION-x64.exe.blockmap"             "payload/latest.yml"             --repo "$GITHUB_REPOSITORY"             --target main             --title "AutoTek ERP $VERSION"             --notes "AutoTek ERP $VERSION performance update. Fixes a desktop storage regression introduced in v1.0.11 by caching the canonical data store in memory, batching legacy migration, and preserving atomic disk writes and rollback safety."
          echo "RELEASE_PUBLISH=PASS"
