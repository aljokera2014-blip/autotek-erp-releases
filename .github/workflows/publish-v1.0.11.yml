name: Publish AutoTek ERP v1.0.11

on:
  push:
    branches:
      - main
    paths:
      - release-v1.0.11.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-fca0-8211-848e-8004768fec17/raw?se=2026-09-26T14%3A41%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=1fa53b58-ae3b-54c4-9082-ed139d74aa6a&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T01%3A09%3A08Z&ske=2026-09-27T01%3A09%3A08Z&sks=b&skv=2026-02-06&sig=aK3XVOEPpEOnkrHn1Fv8r1aJOGXSRxOig9WqiGBk7vU%3D'
      VERSION: '1.0.11'
    steps:
      - name: Download verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o update.zip
          unzip -q update.zip -d payload
          find payload -maxdepth 2 -type f -print

      - name: Verify update payload
        shell: bash
        run: |
          set -euo pipefail
          test -f "payload/AutoTek-ERP-Setup-$VERSION-x64.exe"
          test -f "payload/AutoTek-ERP-Setup-$VERSION-x64.exe.blockmap"
          test -f "payload/latest.yml"
          grep -q "version: $VERSION" payload/latest.yml
          echo "RELEASE_PAYLOAD_VERIFY=PASS"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION"             "payload/AutoTek-ERP-Setup-$VERSION-x64.exe"             "payload/AutoTek-ERP-Setup-$VERSION-x64.exe.blockmap"             "payload/latest.yml"             --repo "$GITHUB_REPOSITORY"             --target main             --title "AutoTek ERP $VERSION"             --notes "AutoTek ERP $VERSION desktop update. Includes the unified professional document templates, safer desktop persistence, configured VAT handling, improved mobile document entry, and robust multi-page PDF output."
          echo "RELEASE_PUBLISH=PASS"
